{% extends "core/admin/base.html" %}

{% block title %}Editar turma{% endblock %}

{% block content %}
    <a href="{% url 'admin_turma_detalhe' turma.pk %}" class="mt-6 inline-block text-sm font-medium text-green-700">← Voltar para a turma</a>
    <section class="mx-auto mt-4 max-w-xl rounded-xl border bg-white p-8 shadow-sm">
        <h1 class="text-2xl font-bold">Editar turma</h1>
        <form method="post" class="mt-6 grid gap-4">
            {% csrf_token %}
            <label class="block text-sm font-medium">
                {{ form.nome.label }}
                {{ form.nome }}
                {% for error in form.nome.errors %}
                    <span class="mt-1 block text-sm text-red-700">{{ error }}</span>
                {% endfor %}
            </label>
            <button type="submit" class="rounded-lg bg-green-700 px-5 py-3 font-semibold text-white hover:bg-green-800">
                Salvar alterações
            </button>
        </form>
    </section>
{% endblock %}
