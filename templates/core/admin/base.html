<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Administração{% endblock %} | QuiX</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-50 text-gray-900">
    <main class="mx-auto max-w-5xl p-6">
        <nav class="flex items-center justify-between">
            <a href="{% url 'home' %}" class="text-2xl font-bold text-green-700">QuiX</a>
            <div class="flex items-center gap-5">
                <a href="{% url 'admin_alunas' %}" class="text-sm font-medium text-green-700">Alunas</a>
                <a href="{% url 'admin_turmas' %}" class="text-sm font-medium text-green-700">Turmas</a>
                <a href="{% url 'perfil' %}" class="text-sm font-medium text-green-700">Meu perfil</a>
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button class="text-sm font-medium text-green-700" type="submit">Sair</button>
                </form>
            </div>
        </nav>

        {% block header %}{% endblock %}

        {% for message in messages %}
            <p class="mt-4 rounded-lg p-3 text-sm
                {% if message.level_tag == 'error' %}bg-red-50 text-red-800
                {% elif message.level_tag == 'info' %}bg-blue-50 text-blue-800
                {% else %}bg-green-50 text-green-800{% endif %}">{{ message }}</p>
        {% endfor %}

        {% block content %}{% endblock %}
    </main>
</body>
</html>
