<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha área | QuiX</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-50 text-gray-900">
    <main class="mx-auto max-w-4xl p-6">
        <nav class="flex items-center justify-between">
            <a href="{% url 'home' %}" class="text-2xl font-bold text-green-700">QuiX</a>
            <div class="flex items-center gap-5">
                <a href="{% url 'perfil' %}" class="text-sm font-medium text-green-700">Meu perfil</a>
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button class="text-sm font-medium text-green-700" type="submit">Sair</button>
                </form>
            </div>
        </nav>
        <section class="mt-10 rounded-xl border bg-white p-8 shadow-sm">
            <p class="font-semibold text-green-700">Minha área</p>
            <h1 class="mt-2 text-3xl font-bold">
                Olá, {{ request.user.first_name|default:request.user.email }}!
            </h1>
            <p class="mt-3 text-gray-600">
                Em breve você poderá acompanhar seus quizzes e seu progresso por aqui.
            </p>
        </section>
    </main>
</body>
</html>
