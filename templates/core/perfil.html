<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu perfil | QuiX</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-50 text-gray-900">
    <main class="mx-auto max-w-3xl p-6">
        <nav class="flex items-center justify-between">
            <a href="{% url 'home' %}" class="text-2xl font-bold text-green-700">QuiX</a>
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button class="text-sm font-medium text-green-700" type="submit">Sair</button>
            </form>
        </nav>
        <section class="mt-10 rounded-xl border bg-white p-8 shadow-sm">
            <h1 class="text-2xl font-bold">Meu perfil</h1>
            <dl class="mt-6 grid gap-4">
                <div>
                    <dt class="text-sm text-gray-500">Nome</dt>
                    <dd class="font-medium">{{ request.user.get_full_name|default:request.user.email }}</dd>
                </div>
                <div>
                    <dt class="text-sm text-gray-500">E-mail</dt>
                    <dd class="font-medium">{{ request.user.email }}</dd>
                </div>
                <div>
                    <dt class="text-sm text-gray-500">Perfil</dt>
                    <dd class="font-medium">{{ perfil.get_tipo_display }}</dd>
                </div>
            </dl>
        </section>
    </main>
</body>
</html>
